#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mailpit"
name = "Mailpit"
description.en = "Modern SMTP testing server with web UI to inspect captured emails"
description.fr = "Serveur SMTP de test moderne avec interface web pour inspecter les emails"

version = "1.31.1~ynh1"

maintainers = ["patou"]

[upstream]
license = "MIT"
website = "https://mailpit.axllent.org"
admindoc = "https://mailpit.axllent.org/docs/"
code = "https://github.com/axllent/mailpit"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mailpit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    format = "tar.gz"
    extract = true
    in_subdir = false

        [resources.sources.main.amd64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.1/mailpit-linux-amd64.tar.gz"
        sha256 = "87d2652abd7c17dc99029147ff62ac671afdf7fd76630f7faf5b14125211c709"

        [resources.sources.main.i386]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.1/mailpit-linux-386.tar.gz"
        sha256 = "483a48b32df9e81aaaef25c3af5bf4d7225a4259d95fb866bc68025c2838c019"

        [resources.sources.main.armhf]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.1/mailpit-linux-arm.tar.gz"
        sha256 = "b94583eeee7f47e6257f4d55d823c11d097d2c23e7e1a2dbab3e01cb36c82913"

        [resources.sources.main.arm64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.1/mailpit-linux-arm64.tar.gz"
        sha256 = "be6a1f9dcf0ac0d7157ee777eac2b5351352b367bcae3c0a0f4854da60546884"

        [resources.sources.main.autoupdate]
        strategy = "latest_github_release"
        asset.amd64 = "mailpit-linux-amd64.tar.gz"
        asset.i386 = "mailpit-linux-386.tar.gz"
        asset.armhf = "mailpit-linux-arm.tar.gz"
        asset.arm64 = "mailpit-linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8025
    smtp.default = 1025
    smtp.exposed = "TCP"
