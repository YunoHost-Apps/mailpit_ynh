#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mailpit"
name = "Mailpit"
description.en = "Modern SMTP testing server with web UI to inspect captured emails"
description.fr = "Serveur SMTP de test moderne avec interface web pour inspecter les emails"

version = "1.33.1~ynh1"

maintainers = ["patou"]

[upstream]
license = "MIT"
website = "https://mailpit.axllent.org"
admindoc = "https://mailpit.axllent.org/docs/"
code = "https://github.com/axllent/mailpit"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mailpit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    format = "tar.gz"
    extract = true
    in_subdir = false

        [resources.sources.main.amd64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-amd64.tar.gz"
        sha256 = "84d7fe375ebef25df26758984dc0d5d5e17d8c0734cb2e77be7873b14ab51716"

        [resources.sources.main.i386]
        url = "https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-386.tar.gz"
        sha256 = "2ff60fd9dbe63175ab96e324e917d8e58a519f4033e8dd6ea72f43b3da3bd07d"

        [resources.sources.main.armhf]
        url = "https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-arm.tar.gz"
        sha256 = "3020ddbedfc6e9d3f9d40f873078419e55c2133057f0c11deac05743cd805d49"

        [resources.sources.main.arm64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-arm64.tar.gz"
        sha256 = "3c5f076cb676d6980e47da030861c6d60f1f5614103dea93cccbcdfc43198e12"

        [resources.sources.main.autoupdate]
        strategy = "latest_github_release"
        asset.amd64 = "mailpit-linux-amd64.tar.gz"
        asset.i386 = "mailpit-linux-386.tar.gz"
        asset.armhf = "mailpit-linux-arm.tar.gz"
        asset.arm64 = "mailpit-linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8025
    smtp.default = 1025
    smtp.exposed = "TCP"
