#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mailpit"
name = "Mailpit"
description.en = "Modern SMTP testing server with web UI to inspect captured emails"
description.fr = "Serveur SMTP de test moderne avec interface web pour inspecter les emails"

version = "1.31.2~ynh1"

maintainers = ["patou"]

[upstream]
license = "MIT"
website = "https://mailpit.axllent.org"
admindoc = "https://mailpit.axllent.org/docs/"
code = "https://github.com/axllent/mailpit"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mailpit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    format = "tar.gz"
    extract = true
    in_subdir = false

        [resources.sources.main.amd64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.2/mailpit-linux-amd64.tar.gz"
        sha256 = "397a14cad03ae34d7c5f13215fd24971fed5ce48bf4237554829b0a10d4306ad"

        [resources.sources.main.i386]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.2/mailpit-linux-386.tar.gz"
        sha256 = "4beb069f50c1654552cc2bc1343640d9555dc05b44697ec98291e50189a479dc"

        [resources.sources.main.armhf]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.2/mailpit-linux-arm.tar.gz"
        sha256 = "f04cfd2b3baac4ccfd4ac52fea4aa3f5ccc9b6af0c3978b02e41fd3df5caf027"

        [resources.sources.main.arm64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.2/mailpit-linux-arm64.tar.gz"
        sha256 = "91f4e7d94ac302470dbe59379af10222a43ff1625b7aea65f35890daa456817d"

        [resources.sources.main.autoupdate]
        strategy = "latest_github_release"
        asset.amd64 = "mailpit-linux-amd64.tar.gz"
        asset.i386 = "mailpit-linux-386.tar.gz"
        asset.armhf = "mailpit-linux-arm.tar.gz"
        asset.arm64 = "mailpit-linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8025
    smtp.default = 1025
    smtp.exposed = "TCP"
