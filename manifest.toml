#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mailpit"
name = "Mailpit"
description.en = "Modern SMTP testing server with web UI to inspect captured emails"
description.fr = "Serveur SMTP de test moderne avec interface web pour inspecter les emails"

version = "1.31.0~ynh1"

maintainers = ["patou"]

[upstream]
license = "MIT"
website = "https://mailpit.axllent.org"
admindoc = "https://mailpit.axllent.org/docs/"
code = "https://github.com/axllent/mailpit"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mailpit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    format = "tar.gz"
    extract = true
    in_subdir = false

        [resources.sources.main.amd64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.0/mailpit-linux-amd64.tar.gz"
        sha256 = "076b5ded9a2182842b93e761b9586a1a251445bffe2666f9f22a6dc14470237d"

        [resources.sources.main.i386]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.0/mailpit-linux-386.tar.gz"
        sha256 = "61939b1d02f174e488f1cb67c4cd5e340bf991f4a12abd9ef25577bcd15fe786"

        [resources.sources.main.armhf]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.0/mailpit-linux-arm.tar.gz"
        sha256 = "fcfa7d9d2e1618db264cc8ca245420f0aae0740b2a34971221de010fa10cf866"

        [resources.sources.main.arm64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.0/mailpit-linux-arm64.tar.gz"
        sha256 = "db3e685ed59d58354a29a4e7bfd0497f050af771a41e122aabdb0bd4fb915952"

        [resources.sources.main.autoupdate]
        strategy = "latest_github_release"
        asset.amd64 = "mailpit-linux-amd64.tar.gz"
        asset.i386 = "mailpit-linux-386.tar.gz"
        asset.armhf = "mailpit-linux-arm.tar.gz"
        asset.arm64 = "mailpit-linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8025
    smtp.default = 1025
    smtp.exposed = "TCP"
