#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mailpit"
name = "Mailpit"
description.en = "Modern SMTP testing server with web UI to inspect captured emails"
description.fr = "Serveur SMTP de test moderne avec interface web pour inspecter les emails"

version = "1.31.5~ynh1"

maintainers = ["patou"]

[upstream]
license = "MIT"
website = "https://mailpit.axllent.org"
admindoc = "https://mailpit.axllent.org/docs/"
code = "https://github.com/axllent/mailpit"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "i386", "armhf", "arm64"]
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "80M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mailpit"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]

    [resources.sources.main]
    format = "tar.gz"
    extract = true
    in_subdir = false

        [resources.sources.main.amd64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.5/mailpit-linux-amd64.tar.gz"
        sha256 = "5924ace84f38c83c29f941a644a2d7be6c11f339eb4a9a12ab526414897ceed1"

        [resources.sources.main.i386]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.5/mailpit-linux-386.tar.gz"
        sha256 = "e3a40a259e58eaa0f14a4b835f8a069134c3ab495f0af20c90b6ce796eae6113"

        [resources.sources.main.armhf]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.5/mailpit-linux-arm.tar.gz"
        sha256 = "46851c50b656eb82ea2cb6bc0c7cdf3b2c0b5f336eb3686f44e81e4f7fc3a5a7"

        [resources.sources.main.arm64]
        url = "https://github.com/axllent/mailpit/releases/download/v1.31.5/mailpit-linux-arm64.tar.gz"
        sha256 = "ff9b03dd4a01e9680d89837d391296942c0529d545d160a98ed62882eec0e628"

        [resources.sources.main.autoupdate]
        strategy = "latest_github_release"
        asset.amd64 = "mailpit-linux-amd64.tar.gz"
        asset.i386 = "mailpit-linux-386.tar.gz"
        asset.armhf = "mailpit-linux-arm.tar.gz"
        asset.arm64 = "mailpit-linux-arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8025
    smtp.default = 1025
    smtp.exposed = "TCP"
